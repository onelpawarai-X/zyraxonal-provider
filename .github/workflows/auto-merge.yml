name: Auto Merge Pull Requests

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Approve and Auto-Merge PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            
            // ১. PR অনুমোদন (Approve) করা
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                event: 'APPROVE',
                body: 'Auto-approved by ZYRAXON AI automated system.'
              });
              console.log(`Approved PR #${pr.number}`);
            } catch (error) {
              console.log('Review error (ignoring if self-PR):', error.message);
            }

            // ২. PR স্বয়ংক্রিয় মার্জ (Merge) করা
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log(`Successfully auto-merged PR #${pr.number}`);
            } catch (error) {
              core.setFailed(`Failed to auto-merge PR: ${error.message}`);
            }
