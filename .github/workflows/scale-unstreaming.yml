name: Sync upstream catalog

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync catalog
        id: sync
        run: |
          out=$(node scripts/sync-catalog.mjs)
          echo "$out"
          echo "result=$out" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: ${{ !contains(steps.sync.outputs.result, 'NO_CHANGES') }}
        run: |
          git config user.name "zyraxon-sync-bot"
          git config user.email "sayidilxs@gmail.com"
          git add src/lib/catalog/snapshot.json public/api.json public/catalog-meta.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore(catalog): ${{ steps.sync.outputs.result }}"
          git push
