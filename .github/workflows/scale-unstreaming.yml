name: Scale & Refresh Provider Endpoints (PR & Auto-Merge)

on:
  schedule:
    - cron: "0 */4 * * *" # প্রতি ৪ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে চলবে
  workflow_dispatch: # Actions ট্যাব থেকে ম্যানুয়ালি ১-ক্লিকে রান করার সুবিধা

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

env:
  # কোনো মান হার্ডকোড না রেখে Repository Variable দিয়ে ওভাররাইড করা যায়।
  CATALOG_SOURCE: ${{ vars.CATALOG_SOURCE || 'https://models.dev/api.json' }}
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}

jobs:
  refresh-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ১. লেটেস্ট মডেল, নতুন প্রোভাইডার, লোগো ও যাচাইকৃত লিংক সিঙ্ক করা।
      # লিংক সংশোধন src/lib/catalog/link-overrides.json থেকে sync script নিজেই প্রয়োগ করে,
      # তাই জেনারেটেড ফাইলে হাত দেওয়ার দরকার নেই।
      - name: Sync upstream catalog, models & provider logos
        run: node scripts/sync-catalog.mjs

      # ২. ব্রাঞ্চ তৈরি, পুশ, PR ক্রিয়েট এবং স্বয়ংক্রিয়ভাবে Merge করা
      - name: Create Branch, Push, Open PR & Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN দিয়ে করা PR অন্য workflow ট্রিগার করে না, তাই এখানেই merge করা হয়।
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # পরিবর্তনের ফাইলসমূহ স্টেজিংয়ে যুক্ত করা
          git add src/lib/catalog/snapshot.json \
                  src/lib/catalog/link-overrides.json \
                  src/lib/catalog/provider-overrides.json \
                  src/lib/catalog/zyraxon-provider.json \
                  public/api.json \
                  public/models.json \
                  public/providers.json \
                  public/catalog-meta.json \
                  public/logos/

          # কোনো পরিবর্তন না থাকলে প্রস্থান
          if git diff --cached --quiet; then
            echo "All endpoints and catalog data are 100% up to date. No PR needed."
            exit 0
          fi

          # নতুন টাইমস্ট্যাম্পযুক্ত ব্রাঞ্চ তৈরি করা
          TIMESTAMP=$(date +%s)
          BRANCH_NAME="sync/catalog-${TIMESTAMP}"

          echo "Changes detected! Creating sync branch: $BRANCH_NAME"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore(catalog): refresh provider endpoints and upstream models"
          git push origin "$BRANCH_NAME"

          # স্বয়ংক্রিয় Pull Request তৈরি করা (লেবেল ছাড়াই, যাতে কোনো এরর না হয়)
          echo "Opening Pull Request..."
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "chore(catalog): auto-refresh endpoints & models (${TIMESTAMP})" \
            --body "Automated sync bot detected changes:
            - Refreshed provider endpoints via src/lib/catalog/link-overrides.json
            - Synced latest upstream models, providers, and logos
            - Re-applied curated external providers from src/lib/catalog/provider-overrides.json
            - Auto-merging into main branch.")

          echo "Pull Request successfully created at: $PR_URL"

          # সরাসরি Squash Merge করা; required checks থাকলে auto-merge চালু করা
          echo "Auto-merging Pull Request into main..."
          if gh pr merge "$PR_URL" --squash --delete-branch; then
            echo "Pull Request merged successfully."
          elif gh pr merge "$PR_URL" --squash --delete-branch --auto; then
            echo "Auto-merge enabled; the PR will merge once required checks pass."
          else
            echo "Could not merge automatically. Please merge $PR_URL manually."
          fi

          echo "Sync workflow completed successfully!"
